<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97736" />
      <stop offset="100%" stop-color="#120905" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97736" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="#120905" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="16" />

  <!-- Coffee Cup Icon -->
  <path d="M120 180 h272 v120 a96 96 0 0 1 -96 96 h-80 a96 96 0 0 1 -96 -96 z" fill="url(#coffeeGrad)" stroke="#fbbf24" stroke-width="12" />
  
  <!-- Handle -->
  <path d="M392 210 h32 a48 48 0 0 1 48 48 v16 a48 48 0 0 1 -48 48 h-32" fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" />

  <!-- Steam Waves -->
  <path d="M180 140 c10 -20 -10 -40 0 -60" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" />
  <path d="M256 130 c12 -24 -12 -48 0 -70" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <path d="M332 140 c10 -20 -10 -40 0 -60" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" />

  <!-- Grid Text "TTS" -->
  <text x="256" y="310" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="72" letter-spacing="4">TTS</text>
</svg>
